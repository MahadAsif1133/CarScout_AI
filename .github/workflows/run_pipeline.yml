name: GaadiScout Pipeline

on:
  # Run every 3 hours automatically
  schedule:
    - cron: '0 */3 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to scrape'
        required: false
        default: '5'
      deal_threshold:
        description: 'Deal threshold % (e.g. 15.0)'
        required: false
        default: '15.0'
      disable_alerts:
        description: 'Set to "true" to disable alerts (dry run)'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Restore DB from cache (persist between runs) ─────────────────────
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: gaadiscout.db
          key: gaadiscout-db-${{ github.run_id }}
          restore-keys: |
            gaadiscout-db-

      # ── 5. Restore LoRA adapter cache (if trained) ───────────────────────────
      - name: Restore LoRA adapter cache
        uses: actions/cache@v4
        with:
          path: lora_adapter/
          key: gaadiscout-lora-${{ hashFiles('lora_adapter/**') }}
          restore-keys: |
            gaadiscout-lora-

      # ── 6. Run pipeline ─────────────────────────────────────────────────────
      - name: Run GaadiScout Pipeline
        env:
          # Groq API
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # Email (Gmail SMTP)
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}

          # Hugging Face (for model downloads)
          HF_TOKEN:           ${{ secrets.HF_TOKEN }}

          # Pipeline config (from manual trigger inputs or defaults)
          SCRAPE_MAX_PAGES:   ${{ github.event.inputs.max_pages || '5' }}
          DEAL_THRESHOLD:     ${{ github.event.inputs.deal_threshold || '15.0' }}
          ENABLE_TELEGRAM:    ${{ github.event.inputs.disable_alerts == 'true' && 'false' || 'true' }}
          ENABLE_EMAIL:       ${{ github.event.inputs.disable_alerts == 'true' && 'false' || 'true' }}

          # Prediction mode: 'statistical' always works without GPU
          PREDICTION_MODE:    'statistical'

        run: python main.py

      # ── 7. Upload DB as artifact (for debugging/inspection) ────────────────
      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaadiscout-db-${{ github.run_number }}
          path: gaadiscout.db
          retention-days: 7

      # ── 8. Save DB back to cache ─────────────────────────────────────────────
      - name: Save database cache
        if: always() && hashFiles('gaadiscout.db') != ''
        uses: actions/cache/save@v4
        with:
          path: gaadiscout.db
          key: gaadiscout-db-${{ github.run_id }}
